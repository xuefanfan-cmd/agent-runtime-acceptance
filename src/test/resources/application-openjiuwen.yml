    # DEFAULT_TOOL_CALL_TIMEOUT=1800 / stream-idle=1800 / max-iterations=4——D3 同族，判据均为结构性）。
    # 独立条目的理由：068 批次证据须绑定自己的制品指纹，不共用 067 线的 SUT 钉子。
    deepanalyze-feat068:
