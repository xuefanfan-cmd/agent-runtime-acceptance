# Openjiuwen travel-chain environment configuration.
# Managed SUT agents launched from ~/.m2 — the openjiuwen variant of the travel chain
# (mainplan → trip → hotel, artifacts agent-openjiuwen-travel-*). Same structure as
# application-local.yml; select it with: ./mvnw -Dtest.env=openjiuwen ...

sut:
  # ------------------------------------------------------------------
  # FEAT-048 外部环境（已部署，全部用例可执行）：
  #   - Nacos 3.0.0 服务端：podman feat048-nacos（127.0.0.1:8848，standalone，
  #     内嵌存储，namespace tenant-A / tenant-B 已建，v1 OpenAPI 兼容）
  #   - Nacos 模式 SUT 制品：fixtures/feat048-sut/（start-nacos.sh / start-rdc.sh /
  #     start-sut.sh / stop-sut.sh；runtime A chaos 生命周期 45s 注册 / 25s 注销）
  #   - RDC 对照：registry-discovery-center 0.1.1（127.0.0.1:18092，postgres agent_rdc）
  # 停用环境时注释掉整个 external.nacos 块即可（测试类自动 dependency-gated 跳过）。
  # ------------------------------------------------------------------
  # ------------------------------------------------------------------
  # FEAT-048 外部环境（门禁已恢复：以下 sut.external.nacos.* 全部注释，
  # Feat048* 测试类回到 dependency-gated（整类 SKIPPED，不计 PASS）。
  # 背景：产品 Nacos 模式 runtime/gateway 正式制品尚未交付（~/.m2 com.openjiuwen
  # 制品中无 nacos 引用），此前 2026-09-21 的 33/33 通过是用验收 Fixture 替身制品
  # （fixtures/feat048-sut/）完成的联通验证，标记为 FIXTURE-PASS，不构成产品
  # FEAT-048 验收结论（见 build-logs/FEAT048-test-report-20260921.md）。
  # 产品制品合入后：启动 fixtures/feat048-sut/ 环境（或指向真实制品地址），
  # 取消下列注释（或将键值改为真实制品地址）即可全量执行。
  # ------------------------------------------------------------------
  external:
    nacos:
      base-url: "http://127.0.0.1:8848"          # Nacos 服务端（门禁开关）
      tenant-id: "tenant-A"                      # 测试租户（namespace 恒等映射）
      runtime-base-url: "http://127.0.0.1:9481"  # runtime A（chaos：注册45s/注销25s）
      runtime-agent-id: "feat048-travel-hotel"   # agentId（== serviceId）
      peer-runtime-base-url: "http://127.0.0.1:9482"   # 稳定第二实例（同 agentId）
      gateway-base-url: "http://127.0.0.1:9480"  # Nacos 模式 gateway（direct，兼 SPI 探针）
      gateway-token: "acceptance-token"          # 测试 Bearer
      bus-gateway-base-url: "http://127.0.0.1:9479"   # Nacos 模式 BUS 路径 gateway（fixture）
      rdc-gateway-base-url: "http://127.0.0.1:9478"   # RDC 模式对照 gateway（fixture）
      peer-tenant-id: "tenant-B"                 # 跨租户 fixture
      peer-tenant-agent-id: "feat048-peer-tenant-agent"
      drift-runtime-base-url: "http://127.0.0.1:9484"  # 服务标识漂移变体（fixture，drift-agent / travel-hotel identity）
      drift-runtime-agent-id: "feat048-drift-agent"
      credential-canary: "FEAT048_CANARY_SECRET_9f8a7b"    # 测试专用假凭据（F048-16 脱敏扫描）
      log-files: "D:/code/test/agent-runtime-acceptance/build-logs/gateway-nacos-9480.out,D:/code/test/agent-runtime-acceptance/build-logs/runtime-a-9481.out,D:/code/test/agent-runtime-acceptance/build-logs/runtime-b-9482.out"
      spi-probe-base-url: "http://127.0.0.1:9485" # 发现面探针（fixture gateway，提供 /discovery 端点）
      crash-window-seconds: 30                      # F048-04 临时实例注销窗口（测试主动注册/注销验证）
      graceful-stop-window-seconds: 30               # F048-05 临时实例注销窗口（测试主动注册/注销验证）
      reregister-window-seconds: 120
      outage-window-seconds: 20
      cluster-failover-window-seconds: 20
      negative-variant-command: "cmd /c D:\\code\\test\\agent-runtime-acceptance\\build-logs\\neg-type.bat"
      negative-variant-expect-keywords: "FAILED,not found,could not,bean"
      gate-variant-command: "cmd /c D:\\code\\test\\agent-runtime-acceptance\\build-logs\\neg-gate.bat"
      gate-variant-expect-keywords: "fail,capability,probe,unavailable"
      unreachable-variant-command: "cmd /c D:\\code\\test\\agent-runtime-acceptance\\build-logs\\neg-unreachable.bat"
      unreachable-variant-expect-keywords: "fail,unavailable,connection,unreachable"
  timeout:
    poll-seconds: 120
    poll-interval-ms: 500
    connect-timeout-seconds: 5
    read-timeout-seconds: 30
    startup-seconds: 60
  wire-log:
    enabled: true
  services:
    postgres:
      image: postgres:16.2
      port: 5432
      env:
        POSTGRES_DB: agent_rdc
        POSTGRES_USER: agent_rdc
        POSTGRES_PASSWORD: agent_rdc
    redis:
      image: redis:7-alpine
      port: 6379
      # Podman on Windows: Testcontainers HostPortWaitStrategy times out on mapped ports.
      # Use a pre-started Redis (podman run -d -p 6379:6379 redis:7-alpine) and treat as remote.
      url: "localhost:6379"
    envexplorer:
      image: agent-env/env-explorer:20260705
      port: 3001
    jiuwenbox:
      image: jiuwenbox:latest
      port: 8321
      # Remote mode must use host:port without a scheme, e.g. 127.0.0.1:8321.
      # url: "127.0.0.1:8321"
      env:
        JIUWENBOX_POLICY_PATH: /app/configs/wsl-dev-policy.yaml
      # Read only by OJ-09/OJ-10's inline container factory.
      test-container:
        privileged: true
        host-port: 8321
        source-policy: /app/configs/default-policy.yaml
        working-policy: /app/configs/wsl-dev-policy.yaml
        runtime-policy: /usr/local/lib/python3.11/configs/default-policy.yaml
        policy-dir: /root/.jiuwenbox/policies
        state-dir: /root/.jiuwenbox/state
        restart-after-bootstrap: true
  # Managed SUT agents — Maven coordinates resolved from the local repository (~/.m2).
  # The framework launches these as black-box java -jar processes. third_party jars
  # are for code analysis only and are never used at runtime.
  # Per-agent JVM -D / Spring -- override hints are documented in application-local.yml.
  agents:
    registry-center:
      group: com.openjiuwen
      artifact: registry-discovery-center
      version: 0.1.0
      port: 18092
      ready-mode: tcp
      spring:
        properties:
          spring.datasource.username: agent_rdc
          spring.datasource.password: agent_rdc
          spring.flyway.enabled: true
          rdc.deployment-discovery.enabled: false
          agent-bus.registry.mvp.probe-interval-ms: 600000
      service-bindings:
        postgres:
          url-key: spring.datasource.url
          url-template: "jdbc:postgresql://{{url}}/agent_rdc"
    gateway-direct:
      group: com.openjiuwen
      artifact: agent-gateway
      version: 0.1.0
      ready-mode: tcp
      spring:
        properties:
          gateway.path-mode: direct
          gateway.default-agent-id: source-agent
          gateway.test-credential.token: acceptance-token
          gateway.test-credential.principalId: acceptance-principal
          gateway.test-credential.tenantId: tenant-a
    # react scenario
    mainplan:
      group: com.openjiuwen.example
      artifact: travel-demo-mainplan
      version: 0.1.1
      llm-api-key-property: openjiuwen.travel.mainplan.llm.api-key
      port: 8095
      remote-agents-prefix: openjiuwen.service.a2a.remote-agents
      spring:
        properties:
          openjiuwen.service.a2a.remote-agents[0].name: "travel-trip"
    hosted-react:
      group: com.openjiuwen.example
      artifact: multi-react-travel-hosted-demo
      version: 0.1.1
    mainplan-redis:
      group: com.openjiuwen.example
      artifact: travel-demo-mainplan
      version: 0.1.1
      llm-api-key-property: openjiuwen.travel.mainplan.llm.api-key
      remote-agents-prefix: openjiuwen.service.a2a.remote-agents
      spring:
        properties:
          openjiuwen.service.a2a.remote-agents[0].name: "travel-trip"
      service-bindings:
        redis:
          url-key: main-plan-agent.redis-url
          url-template: "redis://{{url}}"
    # DFX-001-only alias: same formal demo artifact, isolated profile and random port.
    mainplan-dfx001-probe:
      group: com.openjiuwen.example
      artifact: travel-demo-mainplan
      version: 0.1.1
      profile: dfx001-probe
      llm-api-key-property: openjiuwen.travel.mainplan.llm.api-key
      remote-agents-prefix: openjiuwen.service.a2a.remote-agents
      spring:
        properties:
          openjiuwen.service.a2a.remote-agents[0].name: "travel-trip"
    trip:
      group: com.openjiuwen.example
      artifact: travel-demo-trip
      version: 0.1.1
      llm-api-key-property: openjiuwen.travel.trip.llm.api-key
      port: 8094
      remote-agents-prefix: openjiuwen.service.a2a.remote-agents
      spring:
        properties:
          # MUST match RemoteHotelRail agentName / jar default.
          openjiuwen.service.a2a.remote-agents[0].name: "travel-hotel"
    hotel:
      group: com.openjiuwen.example
      artifact: travel-demo-hotel
      version: 0.1.1
      llm-api-key-property: openjiuwen.travel.hotel.llm.api-key
      port: 8093
      remote-agents-prefix: openjiuwen.service.a2a.remote-agents
    hotel-skillhub:
      group: com.openjiuwen.example
      artifact: travel-demo-hotel
      version: 0.1.1
      llm-api-key-property: openjiuwen.travel.hotel.llm.api-key
      profile: skillhub-remote
    hotel-sandbox:
      group: com.openjiuwen.example
      artifact: travel-demo-hotel
      version: 0.1.1
      llm-api-key-property: openjiuwen.travel.hotel.llm.api-key
      remote-agents-prefix: openjiuwen.service.a2a.remote-agents
      service-bindings:
        jiuwenbox:
          url-key: openjiuwen.service.external.sandbox.servers[0].service-url
          url-template: "http://{{url}}"
    # Duplicate hotel instance for multi-instance dedup testing (RdcMultiInstanceDedupTest)
    hotel-dup:
      group: com.openjiuwen.example
      artifact: travel-demo-hotel
      version: 0.1.1
      llm-api-key-property: openjiuwen.travel.hotel.llm.api-key
    # deepresearch secnario
    deep-research:
      group: com.openjiuwen.example
      artifact: agent-deep-research
      version: 0.1.1
      llm-api-key-property: openjiuwen.demo.deep-research.api-key
    hosted-deep:
      group: com.openjiuwen.example
      artifact: multi-deep-research-hosted-demo
      version: 0.1.1
    # FEAT-042 production EDPA engine. Its executable Spring Boot artifact is
    # published with the `exec` classifier; the feature test supplies a
    # classifier-aware black-box launcher without changing framework semantics.
    edpa-multi:
      group: com.openjiuwen
      artifact: edp-agent-engine
      version: 0.1.1
      profile: multi
    deep-research-auto:
      group: com.openjiuwen.example
      artifact: agent-deep-research
      version: 0.1.0
      llm-api-key-property: openjiuwen.demo.deep-research.api-key
      remote-agents-prefix: openjiuwen.service.a2a.remote-agents
      spring:
        properties:
          openjiuwen.service.a2a.remote-agents[0].name: "search-agent"
          openjiuwen.service.a2a.remote-agents[0].streaming: true
          openjiuwen.service.a2a.remote-agents[1].name: "verify-agent"
    # FEAT-005 SkillHub DeepAgent 黑盒:与 deep-research 同坐标,别名隔离供 SkillHubDeepAgentBlackboxTest
    # 独立启动。不注入 SEARCH_AGENT_URL,让 planner 直接用 skill 回答,避开 sub-agent 干扰。
    deep-research-skillhub:
      group: com.openjiuwen.example
      artifact: agent-deep-research
      version: 0.1.0
      llm-api-key-property: openjiuwen.demo.deep-research.api-key
    search:
      group: com.openjiuwen.example
      artifact: agent-search
      version: 0.1.0
      profile: stub
      llm-api-key-property: openjiuwen.demo.search-agent.api-key
    agent-search:
      group: com.openjiuwen.example
      artifact: agent-search
      version: 0.1.0
      llm-api-key-property: openjiuwen.demo.search-agent.api-key
    verify:
      group: com.openjiuwen.example
      artifact: agent-verify
      version: 0.1.0
      llm-api-key-property: openjiuwen.demo.verify-agent.api-key
    # FEAT-031 Studio DSL demo — start→input→setVariable→message→card→code→llm→streamTransform→end
    studio-dsl-demo:
      group: com.openjiuwen.example
      artifact: studio-dsl-demo
      version: 0.1.0
      port: 8097
      llm-api-key-property: studio-dsl.api-key
      spring:
        properties:
          studio-dsl.agent: main
          studio-dsl.api-base: ${LLM_API_BASE:http://localhost:4000/v1}
          studio-dsl.model-name: ${LLM_MODEL:gpt-4o-mini}
          studio-dsl.ssl-verify: ${LLM_SSL_VERIFY:true}
    # FEAT-031 exception node test — start→exception
    studio-dsl-exc:
      group: com.openjiuwen.example
      artifact: studio-dsl-demo
      version: 0.1.0
      port: 8098
      spring:
        properties:
          studio-dsl.agent: exc
    # FEAT-031 code failure surface — KeyError (JJ)
    studio-dsl-code-err:
      group: com.openjiuwen.example
      artifact: studio-dsl-demo
      version: 0.1.0
      port: 8099
      spring:
        properties:
          studio-dsl.agent: code-err
    # FEAT-031 code failure surface — invalid JSON (KK)
    studio-dsl-code-io-err:
      group: com.openjiuwen.example
      artifact: studio-dsl-demo
      version: 0.1.0
      port: 8100
      spring:
        properties:
          studio-dsl.agent: code-io-err
    # FEAT-031 code failure surface — non-dict return (V)
    studio-dsl-code-return-err:
      group: com.openjiuwen.example
      artifact: studio-dsl-demo
      version: 0.1.0
      port: 8101
      spring:
        properties:
          studio-dsl.agent: code-return-err
    # FEAT-031 input node test — start→input→end
    studio-dsl-input:
      group: com.openjiuwen.example
      artifact: studio-dsl-demo
      version: 0.1.0
      port: 8103
      spring:
        properties:
          studio-dsl.agent: input
    # FEAT-031 setVariable operators — increment/decrement/empty/empty_str/empty_arr
    studio-dsl-setvar-ops:
      group: com.openjiuwen.example
      artifact: studio-dsl-demo
      version: 0.1.0
      port: 8104
      spring:
        properties:
          studio-dsl.agent: setvar-ops
    # FEAT-031 code stdout capture — print + return dict
    studio-dsl-code-stdout:
      group: com.openjiuwen.example
      artifact: studio-dsl-demo
      version: 0.1.0
      port: 8105
      spring:
        properties:
          studio-dsl.agent: code-stdout
    # FEAT-031 code blacklist — os.system blocked by CODE_BLACK_LIST
    studio-dsl-code-blacklist:
      group: com.openjiuwen.example
      artifact: studio-dsl-demo
      version: 0.1.0
      port: 8106
      spring:
        properties:
          studio-dsl.agent: code-blacklist
      java:
        system-properties:
          CODE_BLACK_LIST: '["os.system"]'
    # FEAT-031 code timeout — time.sleep(30) with 3s timeout
    studio-dsl-code-timeout:
      group: com.openjiuwen.example
      artifact: studio-dsl-demo
      version: 0.1.0
      port: 8107
      spring:
        properties:
          studio-dsl.agent: code-timeout
    # FEAT-031 intentDetection — start→intentDetection→end
    studio-dsl-intent:
      group: com.openjiuwen.example
      artifact: studio-dsl-demo
      version: 0.1.0
      port: 8108
      llm-api-key-property: studio-dsl.api-key
      spring:
        properties:
          studio-dsl.agent: intent
          studio-dsl.api-base: ${LLM_API_BASE:http://localhost:4000/v1}
          studio-dsl.model-name: ${LLM_MODEL:gpt-4o-mini}
          studio-dsl.ssl-verify: ${LLM_SSL_VERIFY:true}
    # FEAT-031 extractor — start→extractor→end
    studio-dsl-extractor:
      group: com.openjiuwen.example
      artifact: studio-dsl-demo
      version: 0.1.0
      port: 8109
      llm-api-key-property: studio-dsl.api-key
      spring:
        properties:
          studio-dsl.agent: extractor
          studio-dsl.api-base: ${LLM_API_BASE:http://localhost:4000/v1}
          studio-dsl.model-name: ${LLM_MODEL:gpt-4o-mini}
          studio-dsl.ssl-verify: ${LLM_SSL_VERIFY:true}
    # FEAT-031 loop — start→loop→end
    studio-dsl-loop:
      group: com.openjiuwen.example
      artifact: studio-dsl-demo
      version: 0.1.0
      port: 8110
      spring:
        properties:
          studio-dsl.agent: loop
    # FEAT-031 intentDetection config invalid (HH)
    studio-dsl-intent-invalid:
      group: com.openjiuwen.example
      artifact: studio-dsl-demo
      version: 0.1.0
      port: 8111
      spring:
        properties:
          studio-dsl.agent: intent-invalid
    # FEAT-031 extractor config invalid (II)
    studio-dsl-extractor-invalid:
      group: com.openjiuwen.example
      artifact: studio-dsl-demo
      version: 0.1.0
      port: 8112
      spring:
        properties:
          studio-dsl.agent: extractor-invalid
    # FEAT-031 plugin API unreachable (LL)
    studio-dsl-plugin-fail:
      group: com.openjiuwen.example
      artifact: studio-dsl-demo
      version: 0.1.0
      port: 8113
      spring:
        properties:
          studio-dsl.agent: plugin-fail
    # FEAT-031 mcp tool not found (MM)
    studio-dsl-mcp-fail:
      group: com.openjiuwen.example
      artifact: studio-dsl-demo
      version: 0.1.0
      port: 8114
      spring:
        properties:
          studio-dsl.agent: mcp-fail
    # FEAT-031 agent config missing (NN)
    studio-dsl-agent-fail:
      group: com.openjiuwen.example
      artifact: studio-dsl-demo
      version: 0.1.0
      port: 8115
      spring:
        properties:
          studio-dsl.agent: agent-fail
    # FEAT-031 streamTransform config invalid (OO)
    studio-dsl-stream-fail:
      group: com.openjiuwen.example
      artifact: studio-dsl-demo
      version: 0.1.0
      port: 8116
      spring:
        properties:
          studio-dsl.agent: stream-fail
    # FEAT-031 loop empty list (EE)
    studio-dsl-loop-empty:
      group: com.openjiuwen.example
      artifact: studio-dsl-demo
      version: 0.1.0
      port: 8117
      spring:
        properties:
          studio-dsl.agent: loop-empty
    # FEAT-031 knowledgeRetrieval mockDocuments (L)
    studio-dsl-kb:
      group: com.openjiuwen.example
      artifact: studio-dsl-demo
      version: 0.1.0
      port: 8118
      spring:
        properties:
          studio-dsl.agent: kb
    # FEAT-031 MCP docserver (for mcp normal call test)
    studio-dsl-mcp-server:
      group: com.openjiuwen.example
      artifact: agent-mcp-docserver
      version: 0.1.0-SNAPSHOT
      port: 18095
      ready-mode: tcp
      spring:
        properties:
          mcp-doc-server.json-rpc-path: /mcp
    # FEAT-031 mcp normal call (U) — connects to mcp-docserver
    studio-dsl-mcp-ok:
      group: com.openjiuwen.example
      artifact: studio-dsl-demo
      version: 0.1.0
      port: 8119
      spring:
        properties:
          studio-dsl.agent: mcp-ok
          studio-dsl.mcp-url: http://127.0.0.1:18095/mcp
      java:
        system-properties:
          studio.dsl.outbound.allowPrivate: "true"
    # FEAT-031 agent normal call (V) — inline ReAct agent
    studio-dsl-agent-ok:
      group: com.openjiuwen.example
      artifact: studio-dsl-demo
      version: 0.1.0
      port: 8120
      llm-api-key-property: studio-dsl.api-key
      spring:
        properties:
          studio-dsl.agent: agent-ok
          studio-dsl.api-base: ${LLM_API_BASE:http://localhost:4000/v1}
          studio-dsl.model-name: ${LLM_MODEL:gpt-4o-mini}
          studio-dsl.ssl-verify: ${LLM_SSL_VERIFY:true}
    # FEAT-031 plugin normal call (T) — connects to mcp-docserver as HTTP API
    studio-dsl-plugin-ok:
      group: com.openjiuwen.example
      artifact: studio-dsl-demo
      version: 0.1.0
      port: 8121
      spring:
        properties:
          studio-dsl.agent: plugin-ok
          studio-dsl.plugin-url: http://127.0.0.1:18095/mcp
      java:
        system-properties:
          studio.dsl.outbound.allowPrivate: "true"
    # FEAT-031 LLM API unreachable (GG) — wrong endpoint → FAILED
    studio-dsl-llm-fail:
      group: com.openjiuwen.example
      artifact: studio-dsl-demo
      version: 0.1.0
      port: 8122
      spring:
        properties:
          studio-dsl.agent: llm-fail
    # FEAT-031 aggregate node (E)
    studio-dsl-aggregate:
      group: com.openjiuwen.example
      artifact: studio-dsl-demo
      version: 0.1.0
      port: 8123
      spring:
        properties:
          studio-dsl.agent: aggregate
    # FEAT-031 QA node (X1) — random strategy
    studio-dsl-qa:
      group: com.openjiuwen.example
      artifact: studio-dsl-demo
      version: 0.1.0
      port: 8124
      spring:
        properties:
          studio-dsl.agent: qa
    # FEAT-031 ParamOutput node (X9)
    studio-dsl-param-output:
      group: com.openjiuwen.example
      artifact: studio-dsl-demo
      version: 0.1.0
      port: 8125
      spring:
        properties:
          studio-dsl.agent: param-output
    # FEAT-031 errorBranch constraint (RR) — message node with errorBranch
    studio-dsl-errorbranch-constraint:
      group: com.openjiuwen.example
      artifact: studio-dsl-demo
      version: 0.1.0
      port: 8126
      spring:
        properties:
          studio-dsl.agent: errorbranch-constraint
    # FEAT-031 exception constraint (SS) — loop node with defaultOutputs
    studio-dsl-exception-constraint:
      group: com.openjiuwen.example
      artifact: studio-dsl-demo
      version: 0.1.0
      port: 8127
      spring:
        properties:
          studio-dsl.agent: exception-constraint
    # FEAT-031 ParamOutput empty input (X10)
    studio-dsl-param-output-empty:
      group: com.openjiuwen.example
      artifact: studio-dsl-demo
      version: 0.1.0
      port: 8128
