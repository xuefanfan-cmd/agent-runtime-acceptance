# Local development environment configuration
# Suitable for running tests against a local SUT instance.
# Select with: ./mvnw -Dtest.env=LOCAL ... (the default when test.env / TEST_ENV is unset).

# Managed SUT agents — Maven coordinates resolved from the local repository (~/.m2).
# Override repo root when Maven localRepository is not ~/.m2/repository, e.g.:
#   sut.m2.repo: D:/repository
# The framework launches these as black-box java -jar processes. third_party jars
# are for code analysis only and are never used at runtime.
#
# Backing services (Testcontainers): declare image/port under sut.services.<name>.
# Agents reference a service via sut.agents.<name>.service-bindings.<svc> (url-key + url-template only).
# Use official Docker Hub image names here (e.g. redis:7-alpine). For mirror/accelerator
# settings use ~/.testcontainers.properties locally — not in this repo.

sut:
  timeout:
    poll-seconds: 120
    poll-interval-ms: 500
    connect-timeout-seconds: 5
    read-timeout-seconds: 30
    startup-seconds: 60
  # Per-round wire log: records each round's request (OutboundMessage) + response (every InboundEvent,
  # decoded + raw frame) for all 4 modes (A2A stream/sync, REST stream/sync). One file per round under
  # <sut.logging.dir>/wire/<run-id>/<sessionId>-r<round>-<protocol>.log — the run-id subdir groups one
  # mvnw test run. Enable here (or via -Dsut-wire-log-enabled=true). Default is off (no files written).
  # wire-log:
  #   enabled: true
  #   run-id: manual-2026-07-12     # optional; default run-<yyyyMMdd-HHmmss> (one subdir per JVM run)
  #   dir: target/sit-logs/wire     # optional; default <sut.logging.dir>/wire
  services:
    redis:
      image: redis:7-alpine
      port: 6379
  agents:
    mainplan:
      group: com.huawei.ascend.examples
      artifact: agent-travel-mainplan-a2a
      version: 0.2.0-SNAPSHOT
    # Same jar as mainplan; service-bindings start sut.services.redis and inject redis-url.
    # Used by B-03 and B-04 Phase2 (redis checkpointer). B-04 Phase1 uses plain mainplan.
    mainplan-redis:
      group: com.huawei.ascend.examples
      artifact: agent-travel-mainplan-a2a
      version: 0.2.0-SNAPSHOT
      service-bindings:
        redis:
          url-key: main-plan-agent.redis-url
          url-template: "redis://{{url}}"
    trip:
      group: com.huawei.ascend.examples
      artifact: agent-trip-a2a
      version: 0.2.0-SNAPSHOT
    hotel:
      group: com.huawei.ascend.examples
      artifact: agent-hotel-a2a
      version: 0.2.0-SNAPSHOT
    # —— Expense Review（单 jar 双 profile；main profile 经 remote-agents[0] 调 workflow）——
    expense-review-workflow:
      group: com.huawei.ascend.examples
      artifact: agent-workflow-expense-review
      version: 0.2.0-SNAPSHOT
    expense-review-main:
      group: com.huawei.ascend.examples
      artifact: agent-workflow-expense-review
      version: 0.2.0-SNAPSHOT
      profile: main
    # —— Deep-research chain（本地拉起两 jar；FEAT-001 downstream-agent-killed-mid-stream 用例需要
    # 通过 SutStack.stop(...) 中途杀 search，因此必须走 managed 分支而非 remote-only）——
    # deep-research 通过 SEARCH_AGENT_URL 环境变量寻址 search；测试用例在 BeforeAll 钩子里先启 search
    # 再取其解析后的 baseUrl，用 .env(...) 注给 deep-research，因此这里 YAML 不需要 downstream 声明。
    deep-research:
      group: com.openjiuwen.example
      artifact: agent-deep-research
      version: 0.1.0
    search:
      group: com.openjiuwen.example
      artifact: agent-search
      version: 0.1.0
    # deep-research 通过 VERIFY_AGENT_URL 寻址 verify（同 search 的注法）。ParallelSearchComparisonTest
    # 等用例经 SutStack.agent(VERIFY) 启动它，故 local profile 必须声明其 Maven 坐标
    # （fat jar 需预先安装进本地 Maven 仓）。
    verify:
      group: com.openjiuwen.example
      artifact: agent-verify
      version: 0.1.0
    # —— AgentScope 场景（FEAT-002 AgentScope 侧异构框架兼容适配）——
    # 两 jar 交付物位于 D:\agent-solution-common\dist\：
    #   agentscope-hotel-0.1.0.jar（AgentScope 本地 ReActAgent adapter，监听 18120）
    #   travel-trip-0.1.0.jar    （openJiuwen ReAct，客户端唯一入口，监听 8092，委托到 hotel）
    # 未安装到本地 Maven 仓库；本方案以 remote url-only 声明接入（与 deep-research SIT 同型）——
    # 手工按 CLIENT-INTEGRATION-GUIDE §3 或 dist/run.ps1 先起 hotel、再起 trip，然后跑测试。
    # 别名（travel-trip-agentscope / agentscope-hotel）与上方 openjiuwen 场景的 trip/hotel 不冲突，
    # 允许两套 profile 共存于同一 yml。测试类前置 assumeTrue 门探测 agent-card 可达性；
    # 未起 jar 时用例 skip（不 FAIL）。SUT_TRIP_AGENTSCOPE_URL / SUT_HOTEL_AGENTSCOPE_URL 环境变量
    # 可覆盖默认端口，便于本地非默认端口部署。
    travel-trip-agentscope:
      url: "http://localhost:8092"
    agentscope-hotel:
      url: "http://localhost:18120"
    # AgentScope HarnessAgent adapter 变体（agentscope-hotel-harness-0.1.0.jar）
    # 默认端口 18121（jar 需通过 SERVER_PORT/--server.port 参数覆盖默认 18120 以与 ReAct 变体共存）
    # 启动 Harness 场景时把父侧 TRAVEL_HOTEL_A2A_URL 环境变量指向 18121，无需重建父侧
    agentscope-hotel-harness:
      url: "http://localhost:18121"
    # —— EDPAgent（FEAT-028 EDPA 场景下子任务并行验收的委托方 SUT）——
    # 装载 jar 内置 governance/planrule.yaml；本方案不启用业务场景
    # （scenario-home 指向不存在路径 → 走内置通用并行规划路径）。
    # 被委托方通过环境变量 EDP_AGENT_SEARCH_A2A_URL / EDP_AGENT_VERSATILE_A2A_URL 注入。
    edp-agent:
      group: com.openjiuwen.example
      artifact: edp-agent-engine
      version: 0.1.0
  # JVM -D system properties injected into EVERY launched agent (rendered before -jar).
  # Java/JVM convention: proxy + no-proxy go here as standard JVM props; Spring also resolves
  # the agents' ${LLM_*} from these, so LLM may be supplied via -D here too.
  # Uncomment and fill for your environment. Secrets (e.g. LLM_API_KEY) prefer the LLM_* env
  # path (agents read ${LLM_*} natively) rather than this tracked file.
  java:
    system-properties:
#      # —— HTTP proxy + no-proxy (standard JVM proxy properties) ——
#      http.proxyHost:
#      http.proxyPort:
#      https.proxyHost:
#      https.proxyPort:
#      http.nonProxyHosts:
#      # —— LLM (optional; overrides/aligns the agents' ${LLM_*}) ——
#      LLM_PROVIDER:
#      LLM_API_BASE:
#      LLM_MODEL:
#      LLM_API_KEY:
#      LLM_SSL_VERIFY: