  # Per-agent LLM api-key injection: an agent that declares `llm-api-key-property: <spring-key>`
  # gets the global LLM_API_KEY value (below) injected at launch as `--<spring-key>=<LLM_API_KEY>`,
  # a highest-precedence Spring arg that overrides the agent's bundled application.yml — so it works
  # even where code-scanning blanked the agent's `${LLM_API_KEY}` placeholder. The secret value lives
  # ONLY here; each agent entry below carries just the property-key pointer, not the value.
  # Global non-secret JVM defaults. Credentials remain blank in versioned configuration;
  # tests that require a live model must inject them at process launch.
  java:
    system-properties:
      LLM_API_BASE: "https://ws-z7f9qzn05hmkiq2l.cn-beijing.maas.aliyuncs.com/compatible-mode/v1"
      LLM_MODEL: "qwen3.8-max"
      LLM_API_KEY: ""
      LLM_SSL_VERIFY: "false"
#      # —— HTTP proxy + no-proxy (standard JVM proxy properties) ——
#      http.proxyHost:
#      http.proxyPort:
#      https.proxyHost:
#      https.proxyPort:
#      http.nonProxyHosts:
