# SIT environment configuration
# Secrets MUST be sourced from environment variables, never hardcoded here.
#
# Internal host addresses are NOT committed (placeholder: <sit-host>). Provide real
# endpoints at runtime via TestConfig env/property overrides, e.g.:
#   SUT_AGENTS_MAINPLAN_URL=http://<real-host>:13003  (env var)
#   -Dsut-agents-mainplan-url=http://<real-host>:13003  (system property)
sut:
  timeout:
    poll-seconds: 120
    poll-interval-ms: 500
    connect-timeout-seconds: 5
    read-timeout-seconds: 30
    startup-seconds: 60
  agents:
    mainplan:
      # B-03 Phase2 / redis mainplan (pre-deployed). B-04 Phase2 uses the same URL.
      url: http://<sit-host>:13003
      # C-09 bad-LLM mainplan (invalid key + unreachable base). Required for LlmUnavailable*Test.
      url-llm-down: http://<sit-host>:13005
      # B-04 Phase1 in-memory (optional second instance). Comment out when 13004 is not running.
      # url-inmemory: http://<sit-host>:13004
      group: com.huawei.ascend.examples
      artifact: agent-travel-mainplan-a2a
      version: 0.2.0-SNAPSHOT
    trip:
      url: http://7.209.189.82:13001
      group: com.huawei.ascend.examples
      artifact: agent-trip-a2a
      version: 0.2.0-SNAPSHOT
    hotel:
      url: http://7.209.189.82:8081
      group: com.huawei.ascend.examples
      artifact: agent-hotel-a2a
      version: 0.2.0-SNAPSHOT
    # —— Expense Review（单 jar 双 profile；main profile 经 remote-agents[0] 调 workflow）——
    expense-review-workflow:
      group: com.huawei.ascend.examples
      artifact: agent-workflow-expense-review
      version: 0.2.0-SNAPSHOT
    expense-review-main:
      group: com.huawei.ascend.examples
      artifact: agent-workflow-expense-review
      version: 0.2.0-SNAPSHOT
      profile: main
    # —— Deep-research chain（远端预部署；url-only ⇒ 框架不启动、不停止，仅按地址寻址）——
    # DA-01~DA-06 用例集针对 deep-research + search 两 agent；search 目前仅作为 deep-research 的下游被间接触达
    # （通过 SEARCH_AGENT_URL 环境变量在 SUT 侧配置），本仓不直接对它发 A2A 请求，但 DA-01 会独立探测其
    # AgentCard 端点以确认可达性。
    deep-research:
      url: http://7.209.189.82:18090
    search:
      url: http://7.209.189.82:18091
  # JVM -D system properties injected into EVERY launched agent (rendered before -jar).
  # Java/JVM convention: proxy + no-proxy go here as standard JVM props; Spring also resolves
  # the agents' ${LLM_*} from these, so LLM may be supplied via -D here too.
  # Uncomment and fill for your environment. Secrets (e.g. LLM_API_KEY) prefer the LLM_* env
  # path (agents read ${LLM_*} natively) rather than this tracked file.
#  java:
#    system-properties:
#      # —— HTTP proxy + no-proxy (standard JVM proxy properties) ——
#      http.proxyHost:
#      http.proxyPort:
#      https.proxyHost:
#      https.proxyPort:
#      http.nonProxyHosts:
#      # —— LLM (optional; overrides/aligns the agents' ${LLM_*}) ——
#      LLM_PROVIDER:
#      LLM_API_BASE:
#      LLM_MODEL:
#      LLM_API_KEY:
#      LLM_SSL_VERIFY: