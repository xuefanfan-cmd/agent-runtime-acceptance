# Openjiuwen travel-chain environment configuration.
# Managed SUT agents launched from ~/.m2 — the openjiuwen variant of the travel chain
# (mainplan → trip → hotel, artifacts agent-openjiuwen-travel-*). Same structure as
# application-local.yml; select it with: ./mvnw -Dtest.env=openjiuwen ...

sut:
  # ------------------------------------------------------------------
  # FEAT-048 外部环境（已部署，全部用例可执行）：
  #   - Nacos 3.0.0 服务端：podman feat048-nacos（127.0.0.1:8848，standalone，
  #     内嵌存储，namespace tenant-A / tenant-B 已建，v1 OpenAPI 兼容）
  #   - Nacos 模式 SUT 制品：fixtures/feat048-sut/（start-nacos.sh / start-rdc.sh /
  #     start-sut.sh / stop-sut.sh；runtime A chaos 生命周期 45s 注册 / 25s 注销）
  #   - RDC 对照：registry-discovery-center 0.1.1（127.0.0.1:18092，postgres agent_rdc）
  # 停用环境时注释掉整个 external.nacos 块即可（测试类自动 dependency-gated 跳过）。
  # ------------------------------------------------------------------
  # ------------------------------------------------------------------
  # FEAT-048 外部环境（门禁已恢复：以下 sut.external.nacos.* 全部注释，
  # Feat048* 测试类回到 dependency-gated（整类 SKIPPED，不计 PASS）。
  # 背景：产品 Nacos 模式 runtime/gateway 正式制品尚未交付（~/.m2 com.openjiuwen
  # 制品中无 nacos 引用），此前 2026-09-21 的 33/33 通过是用验收 Fixture 替身制品
  # （fixtures/feat048-sut/）完成的联通验证，标记为 FIXTURE-PASS，不构成产品
  # FEAT-048 验收结论（见 build-logs/FEAT048-test-report-20260921.md）。
  # 产品制品合入后：启动 fixtures/feat048-sut/ 环境（或指向真实制品地址），
  # 取消下列注释（或将键值改为真实制品地址）即可全量执行。
  # ------------------------------------------------------------------
  external:
    nacos:
      base-url: "http://127.0.0.1:8848"          # Nacos 服务端（门禁开关）
      tenant-id: "tenant-A"                      # 测试租户（namespace 恒等映射）
      runtime-base-url: "http://127.0.0.1:9481"  # runtime A（chaos：注册45s/注销25s）
      runtime-agent-id: "feat048-travel-hotel"   # agentId（== serviceId）
      peer-runtime-base-url: "http://127.0.0.1:9482"   # 稳定第二实例（同 agentId）
      gateway-base-url: "http://127.0.0.1:9480"  # Nacos 模式 gateway（direct，兼 SPI 探针）
      gateway-token: "acceptance-token"          # 测试 Bearer
      bus-gateway-base-url: "http://127.0.0.1:9479"   # Nacos 模式 BUS 路径 gateway（fixture）
      rdc-gateway-base-url: "http://127.0.0.1:9478"   # RDC 模式对照 gateway（fixture）
      peer-tenant-id: "tenant-B"                 # 跨租户 fixture
      peer-tenant-agent-id: "feat048-peer-tenant-agent"
      drift-runtime-base-url: "http://127.0.0.1:9484"  # 服务标识漂移变体（fixture，drift-agent / travel-hotel identity）
      drift-runtime-agent-id: "feat048-drift-agent"
      credential-canary: "FEAT048_CANARY_SECRET_9f8a7b"    # 测试专用假凭据（F048-16 脱敏扫描）
      log-files: "D:/code/test/agent-runtime-acceptance/build-logs/gateway-nacos-9480.out,D:/code/test/agent-runtime-acceptance/build-logs/runtime-a-9481.out,D:/code/test/agent-runtime-acceptance/build-logs/runtime-b-9482.out"
      spi-probe-base-url: "http://127.0.0.1:9485" # 发现面探针（fixture gateway，提供 /discovery 端点）
      crash-window-seconds: 30                      # F048-04 临时实例注销窗口（测试主动注册/注销验证）
      graceful-stop-window-seconds: 30               # F048-05 临时实例注销窗口（测试主动注册/注销验证）
      reregister-window-seconds: 120
      outage-window-seconds: 20
      cluster-failover-window-seconds: 20
      negative-variant-command: "cmd /c D:\\code\\test\\agent-runtime-acceptance\\build-logs\\neg-type.bat"
      negative-variant-expect-keywords: "FAILED,not found,could not,bean"
      gate-variant-command: "cmd /c D:\\code\\test\\agent-runtime-acceptance\\build-logs\\neg-gate.bat"
      gate-variant-expect-keywords: "fail,capability,probe,unavailable"
      unreachable-variant-command: "cmd /c D:\\code\\test\\agent-runtime-acceptance\\build-logs\\neg-unreachable.bat"
      unreachable-variant-expect-keywords: "fail,unavailable,connection,unreachable"
  timeout:
    poll-seconds: 120
    poll-interval-ms: 500
    connect-timeout-seconds: 5
    read-timeout-seconds: 30
    startup-seconds: 60
  wire-log:
    enabled: true
  services:
    postgres:
      image: postgres:16.2
      port: 5432
      env:
        POSTGRES_DB: agent_rdc
        POSTGRES_USER: agent_rdc
        POSTGRES_PASSWORD: agent_rdc
    redis:
      image: redis:7-alpine
      port: 6379
      # Podman on Windows: Testcontainers HostPortWaitStrategy times out on mapped ports.
      # Use a pre-started Redis (podman run -d -p 6379:6379 redis:7-alpine) and treat as remote.
      url: "localhost:6379"
    envexplorer:
      image: agent-env/env-explorer:20260705
      port: 3001
    jiuwenbox:
      image: jiuwenbox:latest
      port: 8321
      # Remote mode must use host:port without a scheme, e.g. 127.0.0.1:8321.
      # url: "127.0.0.1:8321"
      env:
        JIUWENBOX_POLICY_PATH: /app/configs/wsl-dev-policy.yaml
      # Read only by OJ-09/OJ-10's inline container factory.
      test-container:
        privileged: true
        host-port: 8321
        source-policy: /app/configs/default-policy.yaml
        working-policy: /app/configs/wsl-dev-policy.yaml
        runtime-policy: /usr/local/lib/python3.11/configs/default-policy.yaml
        policy-dir: /root/.jiuwenbox/policies
        state-dir: /root/.jiuwenbox/state
        restart-after-bootstrap: true
  # Managed SUT agents — Maven coordinates resolved from the local repository (~/.m2).
  # The framework launches these as black-box java -jar processes. third_party jars
  # are for code analysis only and are never used at runtime.
  # Per-agent JVM -D / Spring -- override hints are documented in application-local.yml.
  agents:
    # FEAT-031 Studio DSL SIT 夹具（与 application-local.yml 的同名 agent 一致）。
    studio-dsl-ir-sit:
      group: com.openjiuwen.example
      artifact: studio-dsl-ir-sit-demo
      version: 0.1.1
      java:
        system-properties:
          studio.dsl.outbound.allowPrivate: "true"
    # FEAT-054：DA 宿主（deepanalyze-java）——本特性的被测 SUT。
    deepanalyze:
      group: com.openjiuwen
      artifact: deepanalyze-engine
      # ISSUE #389 修复后回归（2026-09-24）：指向含 #389 修复的制品 0.1.4
      # （agent-solution common @ b3155d440（含 PR !690 的 dce93975c），-Drevision=0.1.4 构建）。
      # 历史：0.1.3 = PR !672 合入点 b3ec9700f（#358/#367/#386/#387 四单修复）。
      version: 0.1.4
      # 宿主模块把可执行 jar 发布在 exec classifier 下，普通 jar 是瘦包（无 Main-Class），
      # 框架默认按 <artifactId>-<version>.jar 启动会拉不起来 —— 见 MavenArtifact#jarPath。
      classifier: exec
      # 原"测试侧临时绕过"（占位数据源 spring.datasource.url + initialization-fail-timeout=-1）
      # 已于 2026-09-23 随 ISSUE #358 修复移除：默认配置（数据面关闭）下宿主必须能自行启动，
      # 回归入口见 TestPlan §9.1。若此处再出现占位数据源，本项回归即被静默架空。
      java:
        system-properties:
          deepanalyze.prompt-assembly.compression.enabled: "false"
          deepanalyze.prompt-assembly.system-prompt.enabled: "false"
          deepanalyze.compat.enabled: "true"
          deepanalyze.compat.max-events-per-task: "5000"
          deepanalyze.auth.enabled: "false"
    # FEAT-065/066/067（2026-10-16 新增）：编排层转测批次的 DA 宿主 SUT。
    # **不改动上面 FEAT-054 线的 `deepanalyze:` 条目**（它钉 0.1.4，属另一特性的基线），
    # 而是新增一个独立 agent 名，避免跨特性互相影响。
    # 制品（2026-10-28 18:29 起为 **r8**）：openJiuwen/agent-solution common@**e6e84cd71**（!956，2026-10-28）
    # 源码构建的 0.1.3-feat065067-r9（exec classifier，139 MB；指纹见 01-Design_File/20261015-feat-065-067-orchestration/
    # evidence/20261028-build-r8/artifact-fingerprints-r8.txt）。
    # 🔴 **core 与 runtime 本轮再次重建**：core = 0.1.17@**becb5a7b**（相对 r7 的 f132c038 跨 **20** 个提交，80 文件 +5172/−202）、
    # runtime = 0.1.4@**f7b763e7**（!243，相对 r7 的 b1c3d5df 跨 **7** 个提交，12 文件 +553/−25）。
    # solution 侧 r7→r8 跨 **39** 个提交（deepanalyze-java/engine 被 **11** 个触碰：85 文件 +4910/−340，其中主源码只有 5 个文件；
    # **agent-core-ext-orchestration 零改动** ⇒ FEAT-065/066 的调度面代码未变）。docs 侧 = main@**bd6ac83f**（!383），
    # `bb5be1a3..bd6ac83f` 改了 7 个文件，其中**涉本批 3 个需求的有 6 个**（FEAT-065/066/067 与其三份 L2）⇒ 判据出处**已变**，
    # 本轮按 skill 先做增量审视再刷新哈希（不得为让门禁转绿先改哈希）。
    # ⚠️ **坐标未变但内容已变**（core 仍叫 0.1.17、runtime 仍叫 0.1.4）⇒ r8 继续用**隔离 m2repo** `04-Environment/m2repo-r8`
    # （APFS `cp -c` 克隆自共享 m2repo），新 core/runtime 以原生坐标装进克隆仓 ⇒ 无需改上游 pom。
    # ⇒ **跑 r8 必须三个口径同时指向 m2repo-r8**：环境变量 `SUT_M2_REPO`、`-Dmaven.repo.local`、`-Dsut-m2-repo`。
    # r8 相对 r7 新含的关键改动（本轮要验的）：
    #   `!959`（f6855aa0d，10-28 17:40，Closes #522）——samplingInt/samplingDouble 接受可解析为有限数值的 CharSequence，
    #     非法/不支持的非空值保留 fallback 并打 WARN（带 key、原值、运行时类型、effective fallback）⇒ **#522 待实测回归**。
    #   `!954`（c5e6db30c，10-28 11:57）——🔴 `DaProperties.Workflow.isEnabled` 缺省 **false → true**（"默认开启 DA 编排工具"，
    #     同步改了两版部署手册与 parity golden），**但权威设计文档六处仍写"默认关"**（FEAT-067:44 MUST「六件统一门控默认关」、
    #     :61 配置面「默认 false」、:74 场景「门控关闭|默认部署」、L2-067:43「门控默认关+护栏放行 MUST ✅已有」、
    #     :171 示例 `enabled: false # 默认关`、:178 配置表默认值 false）⇒ **Oracle 冲突**：本批 067-S11
    #     （DaWorkflowGatingToolSetTest，断言缺省 false）与 067-S23（默认装配 no-op 实测）按文档写判据，在 r8 上**预期会 FAIL**。
    #     处置：**不为了让门禁转绿先改判据**，按"设计与实现偏差"取证并另行上报，等设计侧裁定权威口径后再改。
    #   `!943`（9c5842e66）——DA 内置技能 22 件迁移 + 启动期安装（DaEngineConfiguration.prepareBuiltinSkills / DaBuiltinSkillInstaller +198）；
    #   `!952`（1fa40578b）——远端 sandbox 缺省关闭；`!961`/`!958`/`!950`（skillhub #523/#521/#506，他批范围）；
    #   `905522261` 修 issue501~505（SDK 面，他批范围）。
    # 仍未修（10-28 18:30 逐落点复核 @e6e84cd71）：`#474`（D11）——`DaToolResultJsonRail.java` 在 a9c631b8b..e6e84cd71 区间
    #   **一次都没被触碰**（本区间 engine 主源码只改了 DaEngineConfiguration/DaProperties/DaAgentSkillStore/DaBuiltinSkillInstaller/DaWorkflowRunner 五个文件）；
    #   `#461` D6 成员链路——`DaWorkflowRunner:415` 仍是 legacy `.timeout(getMemberTimeoutSeconds())`，未接 `deepanalyze.model.timeout.*` 分层键。
    # 历史基线：r7 = `a9c631b8b`（core f132c038 / runtime b1c3d5df）；r6 = `027c73f41`（core 0b58282c / runtime 765f133d）；r5 = PR !880 head `7b76b482`（仅组件层）；
    #          r4 = `cf4571b30`；r3 = `ce9019d86`；r2 = `f9da5b54f`。
    # ⚠️（历史记录，r4 时点）**r3 → r4 之间 agent-solution 跨 131 个提交**（orchestration 模块 1 个、deepanalyze-java/engine **72 个**，
    #    60 文件 +6151/−128 行，其中含 DaToolContextRail +73 行＝D1/D2 依赖的 owner 作用域机制、
    #    DaEmbeddedTools +71 行＝#465 的当事类、application.yml 19 行）
    #    ⇒ 本轮性质是**回归验证**（含"开发是否引入了新问题"），不是只验 #462 的修复；
    #    **r3 的全部证据保留作"改动前对照面"，逐用例对差**（r3 PASS→r4 FAIL 即为这 131 个提交引入的回归）。
    #    历史：r2 = common@f9da5b54f、r3 = common@ce9019d86。
    # 门控：FEAT-067 §2:44 仍写「六件统一门控默认关」（:61 配置面「默认 false」），但 r8 制品的 `DaProperties.Workflow.isEnabled`
    # 缺省已翻转为 **true**（`!954`）⇒ 此处显式置 true 与缺省同值（端到端面行为不变）；「默认关」这条 Oracle 与实现的冲突按偏差取证，不改判据。
    deepanalyze-feat065067:
      group: com.openjiuwen
      artifact: deepanalyze-engine
      version: 0.1.3-feat065067-r9
      classifier: exec
      java:
        system-properties:
          deepanalyze.prompt-assembly.compression.enabled: "false"
          deepanalyze.prompt-assembly.system-prompt.enabled: "false"
          deepanalyze.compat.enabled: "true"
          deepanalyze.compat.max-events-per-task: "5000"
          deepanalyze.auth.enabled: "false"
          deepanalyze.workflow.enabled: "true"
          deepanalyze.workflow.parallelism: "4"
          # 【2026-10-21 撤销绕行①：checkpointer 不再降级为 in_memory，走宿主自带的默认 redis】
          # 原绕行针对产品缺陷 D4：fat jar 下 core 的 CheckpointerFactory 静态块用**线程上下文类加载器**做
          # ServiceLoader.load(CheckpointerProvider.class)，而该静态块跑在 CompletableFuture$AsyncSupply →
          # ForkJoinPool 公共池线程上（TCCL=系统类加载器），在 Spring Boot fat jar 里看不到
          # BOOT-INF/lib/agent-core-java-0.1.17.jar 内的 META-INF/services/…CheckpointerProvider
          # ⇒ REGISTRY 只剩硬编码兜底的 in_memory/persistence ⇒ 宿主按自带默认配置(redis)起不来。
          # 责任人于 docs#33 答复（comment 194890365）：D4 **已修**——SPI 发现改用**类自身类加载器**
          # （与触发线程解耦），带 TCCL 盲视模拟的红绿对证回归测试，随 agent-core-java **!400** 合入 develop
          # （合并点 `14516e4e8`，2026-10-16）。
          # 🔒 测试侧**独立核实**（不靠对方口径）：`git merge-base --is-ancestor 14516e4e8 f7b76133` → **真**
          # （`14516e4e` = !400 merge feat/058-realdev；本批 core 基线 `f7b76133` = !402，2026-10-19）
          # ⇒ 修复确在本批 r3 制品内。按对方建议"撤前用一个不带降级变量的容器实证一次"，本键删除。
          # 实证结果见批次记录 §7AV 与 evidence/20261021-run-53/。
          #
          # 【2026-10-21 撤销绕行②：不再设 deepanalyze.model.timeout.stream-idle-seconds】
          # 原值 1800 一直是**死键**（§7AN 实测：成员侧生效值为 stream_idle_seconds=600）。
          # docs#32 答复（comment 194890340）明确：FEAT-058 **solution 侧接线后**，显式配置字段越界
          # （connect ∉[5,15] / stream-idle ∉[300,900]）会抛 **IllegalArgumentException**（启动/首次调用即拒）；
          # 只有**系统属性兜底路径**的非法值才回落默认+WARN。责任人点名要求本 fixture"改为 ≤900 或移除
          # （600 默认对长流式已足够——它是相邻两段间空闲上限，不是整请求上限）"。
          # ⇒ **移除**，回到产品默认，拆掉"D5/D6（agent-solution#461）落地即炸宿主启动"这颗定时炸弹。
          #
          # 【仍保留的偏差（唯一一项）】max-iterations 15 → 4：每个成员是裸 ReActAgent，15 轮上限意味着
          # 单成员可能十几次模型调用；7 成员图纸因此极易撞网关超时。本族用例的判据全部是**结构性**的
          # （steps 条数、每步 member、skipped、final_output 来源、L1/L3 结构对照），不依赖成员的推理深度
          # 或输出质量 ⇒ 降低迭代上限不削弱判据。代价（不得忽略）：本轮结果**不代表** max-iterations=15
          # 的生产默认下也能跑完；D5/D6（#461）落地后应撤回本项并重跑。
          # 【2026-10-21 更新】§7BE.2 已核实 **D5 早在 2026-10-15 `0f9d51173` 就修了**（成员超时 60→300 s 且可配
          # deepanalyze.workflow.member-timeout-seconds），r3/r4 制品都含该修复；D6（model.timeout.* 死键）在 r4 仍
          # 零消费方、未修。⇒ 本项撤回的前置条件**只满足一半**，且撤回后单成员可能十几次模型调用、7 成员图纸更易撞
          # 上限；故本轮**暂保留 max-iterations=4**，撤回与否连同"代表性声明"一并交用户裁决（批次记录 §7BE.3/§7BF.7）。
          deepanalyze.model.max-iterations: "4"
          # 【2026-10-26 撤销该键】原为绕 600 s 上限而加，**已实验证伪无效**（见下方原始记录）；
          # 且 r6 起它**反过来有害**：#476 修复引入的 DaRunTimeout 会按「模型收尾 1920 s ＜ 帧间隔上限 ≤ SSE 上限」
          # 校验层级不变量，而本键把 core 的 stream frame timeout 压到 1800000ms ⇒ 宿主启动即告警
          # `core stream frame timeout 1800000ms is shorter than run timeout 1920s (… or
          # -Dopenjiuwen.timeout.blocking-queue-ms set too small)`（run-74 两次 SUT 启动均实测到）。
          # 该告警明示本键是可能成因之一，且 run-74 的 066-S16 出现成员产物为空 ⇒ **摘除后重跑以排除我方 fixture 干扰**。
          # 600 s 上限本身已由 #476 正式修复（deepanalyze.task-loop.run-timeout-seconds，默认 1800 s）。
          #
          # ---- 以下为 2026-10-21 的原始记录（保留留痕，该键已撤销）----
          # 【2026-10-21 新增装置层放宽③：core 同步等待上限 600 s → 1800 s】
          # run-65 实测：066-S16（7 步 multi-perspective-council + 真实模型成员）在 **600.2 s** 处被服务端强制
          # 收尾——响应 status="completed"、output=""、toolCalls[0].status="running"；SUT 日志同一瞬间
          # DaAgentFactory destroying DeepAgent + core TaskScheduler.stop():634 "Cancelled task"。
          # 600 秒唯一吻合的来源＝core TimeoutConstants.DEFAULT_BLOCKING_QUEUE_MS = 600_000L（生效值
          # BLOCKING_QUEUE_MS，**可由系统属性 openjiuwen.timeout.blocking-queue-ms 覆盖**；消费方
          # TaskManager.asCompleted:249、StreamProcessor:113/277/323）。
          # ⚠️ 未能直接坐实是哪一处 poll：asCompleted 到期会打 Loggers.PERFORMANCE.warning，而实测 PERFORMANCE
          # 日志器**不进 SUT stdout**（全日志 grep -c performance → 0）⇒ 按纪律不以推演当结论（批次记录 §7BF.5(3)）。
          # 定性：本键解的是**取证装置上限不够**（与 D3/D5 同族：默认时限 < 真模型编排实际耗时），测试侧可自行解；
