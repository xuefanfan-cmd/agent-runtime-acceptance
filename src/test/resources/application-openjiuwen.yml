    # **显式关闭**对照组。与上面 deepanalyze-feat065067 **逐键相同**，且显式带
    # `deepanalyze.workflow.enabled: "false"`——门控反转后（缺省开启），no-op 支点由「默认部署」改为
    # 「显式关闭」：FEAT-067 对显式关闭的部署是 no-op，这是排除 26 个 FEAT-054 宿主装配面回归用例的支点
    # （docs#43 裁决原文与 TestPlan !509 §2 F 组：S23 改「显式关闭时少六件」）。
    # 判据取宿主日志里主 Agent 的 event=react_model_call_started … tool_count=N 的**最大值**：
    #   开态（r9 基线实测值见测试类常量注记）⇒ 显式关闭必须 = 开态 − 6（六件编排工具）。
    # 之所以不靠"日志里没有六件"来判：tool=<name> 只在**调用时**打印，关闭装配下没人调用 ⇒
    # 那种写法是"以无证据当证据"。tool_count 是**注册期**导出量，与模型是否调用无关。
    deepanalyze-feat065067-wfoff:
      group: com.openjiuwen
      artifact: deepanalyze-engine
      version: 0.1.3-feat065067-r9
      classifier: exec
      java:
        system-properties:
          deepanalyze.prompt-assembly.compression.enabled: "false"
          deepanalyze.prompt-assembly.system-prompt.enabled: "false"
          deepanalyze.compat.enabled: "true"
          deepanalyze.compat.max-events-per-task: "5000"
          deepanalyze.auth.enabled: "false"
          # 【docs#43 反转】本条目的唯一变量：显式关闭六件编排工具的装配（其余键与
